<div class="p-4">
    <h2>Courses</h2>
    <div class="grid grid-cols-4 gap-4">
        <!-- Read courses signal with () -->
        <div *ngFor="let course of courses()">
            <div class="border mb-3 rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition-shadow duration-300">
                <div class="w-full h-2 bg-green-400"></div>
                <div class="p-3 bg-linear-to-r from-gray-200 to-gray-100">
                    <h3>{{ course.courseName }}</h3>
                    <div class="pt-2 flex gap-2">
                        <button 
                            (click)="openCourseViewDialog(course.courseId)" 
                            class="bg-blue-400 hover:bg-blue-500 text-white rounded-2xl py-2 px-3 cursor-pointer">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Evaluate the signals reactively using () -->
@if (isCourseViewDialogOpen() && singleCourse()) {
    <div class="fixed top-0 left-0 w-screen h-screen bg-black/60 flex items-center justify-center z-50">
        <app-course-view-dialog 
            [course]="singleCourse()" 
            [courseId]="singleCourse()!.courseId.toString()"
            [isOpen]="isCourseViewDialogOpen()" 
            (close)="closeCourseViewDialog()">
        </app-course-view-dialog>
    </div>
}
