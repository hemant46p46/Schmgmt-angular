<div class="min-h-screen bg-slate-50 p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-2xl font-bold text-slate-800">Application Dashboard</h1>
      <button (click)="onLogout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg text-sm transition">
        Logout
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- User Module -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <h3 class="text-lg font-semibold text-slate-700 mb-2">User Channel</h3>
        <p class="text-sm p-3 bg-emerald-50 text-emerald-800 font-mono rounded-lg border border-emerald-100">
          {{ userMessage }}
        </p>
      </div>

      <!-- Admin Module -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
        <h3 class="text-lg font-semibold text-slate-700 mb-2">Admin Control Deck</h3>
        <p class="text-sm p-3 rounded-lg font-mono border" 
           [ngClass]="adminMessage.includes('Welcome') ? 'bg-indigo-50 text-indigo-800 border-indigo-100' : 'bg-amber-50 text-amber-800 border-amber-100'">
          {{ adminMessage }}
        </p>
      </div>
    </div>
  </div>
</div>
