<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8 space-y-6">
    <h2 class="text-center text-3xl font-extrabold text-slate-800">Sign in to App</h2>
    
    <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Username</label>
        <input type="text" [(ngModel)]="username" name="username" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" [(ngModel)]="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Login
      </button>
    </form>
  </div>
</div>
